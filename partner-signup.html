<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업체 회원가입 - 빌리언 체험단</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="logo">
        <a href="index.html">
            <img src="images/logo.png" alt="빌리언 체험단">
        </a>
    </div>

    <nav>
        <a href="index.html">홈</a>
        <a href="campaign.html">체험단</a>
        <a href="#">기자단</a>
        <a href="notice.html">공지사항</a>
        <a href="partner-campaign.html">업체등록</a>
    </nav>

    <div class="header-search">
        <input type="text" placeholder="체험단 검색">
    </div>

    <div class="header-user">
        <a href="login.html">로그인</a>
        <a href="signup.html" class="join-btn">회원가입</a>
    </div>
</header>

<section class="login-box">
    <h2>업체 회원가입</h2>
    <p>체험단 모집을 원하는 업체 정보를 입력해주세요.</p>

    <form>
        <input type="text" placeholder="업체명">
        <input type="text" placeholder="담당자명">
        <input type="tel" placeholder="담당자 연락처">
        <input type="email" placeholder="이메일">
        <input type="password" placeholder="비밀번호">
        <input type="text" placeholder="사업자등록번호">

        <button type="submit">업체 회원가입</button>
    </form>

    <a href="login.html">이미 계정이 있으신가요? 로그인</a>
</section>

</body>
</html>
